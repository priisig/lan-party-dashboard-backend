name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # Tests bring their own PostgreSQL via Testcontainers (ubuntu-latest ships a Docker daemon).
      - name: Check
        run: chmod +x gradlew && ./gradlew check --no-daemon
