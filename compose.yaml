# Postgres for local development. Started automatically by `./gradlew bootRun` (spring-boot-docker-compose),
# which also points the app at it – no DB settings needed. Production uses deploy/docker-compose.yml.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lan_dashboard
      POSTGRES_USER: lan
      POSTGRES_PASSWORD: lan
    ports:
      # random free host port, so it never clashes with another local Postgres
      - '5432'
    volumes:
      - lan-dashboard-dev-db:/var/lib/postgresql/data

volumes:
  lan-dashboard-dev-db:
